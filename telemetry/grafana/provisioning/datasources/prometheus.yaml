apiVersion: 1

datasources:
  # The uid is PINNED. Without an explicit uid Grafana generates a random one
  # at first start, and every panel in the provisioned dashboard (which
  # references the datasource by uid) renders "Data source not found".
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Must match `scrape_interval` in prometheus.yml, otherwise Grafana's
      # $__rate_interval is computed from the wrong base and rate() windows
      # can come back empty.
      timeInterval: 5s
